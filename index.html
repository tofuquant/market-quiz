<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tape — Weekly Market Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --panel:#0f1729; --panel2:#0b1222; --line:#22304d; --line2:#33456a;
  --amber:#ffb000; --amberlo:#a86f00; --green:#3ddc84; --greenlo:#1d8a50; --red:#ff4d5e; --redlo:#9e2735;
  --ink:#e6edf5; --muted:#7f8ea8; --faint:#4a5a78;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:"VT323",monospace;font-size:22px;line-height:1.15;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:none}
.sk,.btn,.chip,.badge,h1{font-family:"Silkscreen",monospace;font-weight:400}
svg.px{shape-rendering:crispEdges;display:block}
#crt{position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 140px rgba(0,0,0,.6)}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--panel2) 2px,transparent 2px),linear-gradient(90deg,var(--panel2) 2px,transparent 2px);background-size:32px 32px}

/* ticker */
.ticker{position:sticky;top:0;z-index:20;background:#000;border-bottom:3px solid var(--amber);overflow:hidden;white-space:nowrap;height:34px;display:flex;align-items:center}
.ticker .lbl{flex:none;position:relative;z-index:2;background:var(--amber);color:#000;font-family:"Silkscreen";font-size:12px;letter-spacing:2px;padding:0 10px;height:100%;display:flex;align-items:center}
.ticker .track{display:inline-flex;animation:tick 40s linear infinite;padding-left:12px}
.ticker .item{font-size:22px;margin-right:34px;color:var(--amber)}
.ticker .item b{font-weight:400;color:var(--ink);margin-right:8px}
.ticker .up{color:var(--green)} .ticker .dn{color:var(--red)}
@keyframes tick{to{transform:translateX(-50%)}}

.wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:16px 16px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-weight:700;font-size:22px;letter-spacing:2px;color:var(--amber);text-shadow:3px 3px 0 var(--amberlo)}
.logo small{display:block;font-family:"Silkscreen";font-size:10px;letter-spacing:3px;color:var(--muted)}
.hbtns{display:flex;gap:8px}
.chip{font-size:11px;letter-spacing:2px;color:var(--ink);background:var(--panel);border:3px solid var(--line);padding:7px 9px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--amber);color:var(--amber);outline:0}

/* desk scene */
.desk{position:relative;margin:6px 0 18px;padding:18px 10px 0;background:var(--panel2);border:3px solid var(--line)}
.monitors{display:flex;justify-content:center;gap:8px;align-items:flex-end}
.mon{background:#000;border:4px solid var(--line2);padding:4px;position:relative}
.mon::after{content:"";position:absolute;left:50%;bottom:-12px;width:8px;height:8px;background:var(--line2);transform:translateX(-50%)}
.mon .cap{font-family:"Silkscreen";font-size:9px;letter-spacing:1px;color:var(--amber);margin:0 0 2px 2px}
.mon .num{font-size:18px;margin-left:2px}
.scene-trader{display:flex;justify-content:center;margin-top:14px}
.deskline{height:10px;background:var(--line2);margin:0 -10px}
.bell{position:absolute;right:14px;bottom:18px}

.hero{text-align:center;margin:4px 0 16px}
.hero .big{font-family:"Silkscreen";font-weight:700;font-size:clamp(44px,13vw,72px);letter-spacing:3px;line-height:1;color:var(--amber);text-shadow:4px 4px 0 var(--amberlo),8px 8px 0 #000}
.hero .sub{margin-top:12px;font-family:"Silkscreen";font-size:12px;letter-spacing:5px;color:var(--muted)}

/* panels */
.panel{position:relative;background:var(--panel);border:3px solid var(--line2);box-shadow:6px 6px 0 #000;padding:22px 16px 16px;margin:18px 0}
.badge{position:absolute;left:14px;top:-13px;background:var(--amber);color:#000;font-size:11px;letter-spacing:2px;padding:3px 10px}
.badge.g{background:var(--green)} .badge.r{background:var(--red);color:#fff} .badge.m{background:var(--line2);color:var(--ink)}
.ptitle{font-family:"Silkscreen";font-size:19px;letter-spacing:2px;line-height:1.3;margin:2px 0 8px}
.blurb{color:var(--muted);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--panel2);border:2px solid var(--line);text-align:center;padding:8px 4px 6px}
.stat b{display:block;font-family:"Silkscreen";font-weight:700;font-size:17px;color:var(--amber)}
.stat span{font-size:17px;color:var(--muted)}
.how{margin-top:12px;font-size:19px;color:var(--muted);border-top:2px dashed var(--line);padding-top:10px}
.how em{font-style:normal;color:var(--green)} .how i{font-style:normal;color:var(--red)} .how u{text-decoration:none;color:var(--amber)}

.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;font-size:16px;letter-spacing:4px;padding:16px 10px;cursor:pointer;
  color:#000;background:var(--amber);border:3px solid #000;box-shadow:inset -4px -4px 0 var(--amberlo),inset 4px 4px 0 #ffd36b,6px 6px 0 #000}
.btn:hover,.btn:focus-visible{filter:brightness(1.08);outline:0}
.btn:active{transform:translate(3px,3px);box-shadow:inset 4px 4px 0 var(--amberlo),3px 3px 0 #000}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line2);box-shadow:6px 6px 0 #000;font-size:13px;letter-spacing:3px;padding:13px 10px}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btnrow{display:grid;gap:14px}
.foot{margin-top:24px;color:var(--faint);font-size:18px;text-align:center}

/* game */
.hud{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:end;margin-bottom:10px}
.hud .q{font-family:"Silkscreen";font-size:11px;letter-spacing:2px;color:var(--muted)}
.pnl{font-family:"Silkscreen";font-weight:700;font-size:28px;text-align:right;line-height:1}
.pnl.up{color:var(--green)} .pnl.dn{color:var(--red)} .pnl.flat{color:var(--ink)}
.lev{font-family:"Silkscreen";font-size:11px;letter-spacing:2px;color:var(--amber);text-align:right}
.chartbox{display:flex;gap:8px;align-items:flex-end;background:#000;border:3px solid var(--line2);padding:6px 8px;margin-bottom:10px}
.chartbox svg{flex:1}
.timer{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;padding:4px;border:3px solid var(--line2);background:#000;margin-bottom:4px}
.timer i{height:9px;background:var(--amber)}
.timer i.off{background:#141c2e}
.timer.low i:not(.off){background:var(--red)}
.tlabel{display:flex;justify-content:space-between;font-family:"Silkscreen";font-size:9px;letter-spacing:2px;color:var(--faint);margin-bottom:12px}
.qtext{font-size:28px;line-height:1.12;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:"VT323",monospace;font-size:23px;color:var(--ink);background:var(--panel2);border:3px solid var(--line);padding:9px 12px;cursor:pointer}
.opt .k{flex:none;width:30px;height:30px;display:grid;place-items:center;font-family:"Silkscreen";font-size:13px;background:var(--line);color:var(--ink)}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--amber);outline:0}
.opt:hover:not(:disabled) .k{background:var(--amber);color:#000}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:#0e2a1d}
.opt.right .k{background:var(--green);color:#000}
.opt.wrong{border-color:var(--red);background:#2e0f16;animation:shake .3s steps(3)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.faded{opacity:.35}
@keyframes shake{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}
.reveal{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line);display:none}
.reveal.show{display:block}
.verdict{font-family:"Silkscreen";font-size:13px;letter-spacing:2px;margin-bottom:8px}
.verdict.good{color:var(--green)} .verdict.bad{color:var(--red)}
.reveal p{font-size:22px;color:#c3cfdf}
.src{display:inline-block;margin-top:8px;font-size:20px;color:var(--amber);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.reveal .btn{margin-top:16px}
.pop{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-family:"Silkscreen";font-weight:700;font-size:30px;pointer-events:none;z-index:30;animation:pop 1s steps(8) forwards;text-shadow:3px 3px 0 #000}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-70px)}}
.flash{position:fixed;inset:0;z-index:29;pointer-events:none;animation:flash .25s steps(2) forwards}
@keyframes flash{from{opacity:.22}to{opacity:0}}

/* statement */
.stmt-head{display:flex;justify-content:space-between;font-family:"Silkscreen";font-size:10px;letter-spacing:2px;color:var(--muted);border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
.final{font-family:"Silkscreen";font-weight:700;font-size:54px;line-height:1;margin:6px 0 4px;text-shadow:4px 4px 0 #000}
.rank{font-family:"Silkscreen";font-size:15px;letter-spacing:3px;color:var(--amber);margin-bottom:6px}
.rsub{color:var(--muted);font-size:21px}
.bigchart{background:#000;border:3px solid var(--line2);padding:8px;margin:14px 0 6px}
.ledger{margin-top:4px}
.lrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;border-top:2px solid var(--line);padding:9px 0;align-items:start}
.lrow .n{font-family:"Silkscreen";font-size:10px;color:var(--faint);padding-top:5px}
.lrow b{font-weight:400;font-size:20px;display:block}
.lrow span{font-size:18px;color:var(--muted)}
.lrow span em{font-style:normal;color:var(--green)}
.lrow .amt{font-family:"Silkscreen";font-size:12px;padding-top:4px;white-space:nowrap}
.amt.up{color:var(--green)} .amt.dn{color:var(--red)}
textarea.copyarea{width:100%;margin-top:12px;background:#000;color:var(--green);border:3px solid var(--line2);padding:10px;font:20px "VT323",monospace;display:none}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--amber);color:#000;font:12px "Silkscreen",monospace;letter-spacing:2px;padding:10px 14px;z-index:45;display:none;box-shadow:4px 4px 0 #000}
.toast.show{display:block}
.ed{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;margin-top:10px;cursor:pointer;background:var(--panel2);border:3px solid var(--line)}
.ed:hover,.ed:focus-visible{border-color:var(--amber);outline:0}
.ed b{font-family:"Silkscreen";font-weight:400;font-size:12px;letter-spacing:1px;line-height:1.4;display:block}
.ed span{font-size:19px;color:var(--muted)}
.ed em{font-family:"Silkscreen";font-size:12px;font-style:normal;white-space:nowrap}
.covers{font-family:"Silkscreen";font-size:10px;letter-spacing:2px;color:var(--amber);margin-bottom:8px}
.mhead{font-family:"Silkscreen";font-size:11px;letter-spacing:3px;color:var(--muted);margin:18px 0 -2px;border-bottom:2px dashed var(--line);padding-bottom:4px}
.ytd{font-family:"Silkscreen";font-size:11px;letter-spacing:2px;color:var(--muted);margin:10px 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{width:100%;max-width:440px;background:var(--panel);border:3px solid var(--amber);box-shadow:6px 6px 0 #000;padding:14px}
.modal img{width:100%;display:block;image-rendering:pixelated;border:2px solid var(--line2);-webkit-touch-callout:default}
.modal .hint{font-size:19px;color:var(--muted);text-align:center;margin:10px 0}
.modal .btnrow{gap:10px}
body.pro{--amber:#5cc8ff;--amberlo:#2a6f99}
body.pro .ticker{border-bottom-color:#5cc8ff}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.mbtn{font-family:"Silkscreen",monospace;font-size:13px;letter-spacing:2px;color:var(--muted);background:var(--panel2);border:3px solid var(--line);padding:10px 6px;cursor:pointer;text-align:center;line-height:1.3}
.mbtn small{display:block;font-family:"VT323",monospace;font-size:16px;letter-spacing:0;margin-top:3px;color:var(--faint)}
.mbtn.on{color:#000;background:var(--amber);border-color:#000;box-shadow:4px 4px 0 #000}
.mbtn.on small{color:#000}
.ctx{background:var(--panel2);border-left:4px solid var(--amber);padding:8px 10px;margin:4px 0 12px;font-size:20px;color:#c3cfdf}
.ctx b{display:block;font-family:"Silkscreen";font-weight:400;font-size:10px;letter-spacing:2px;color:var(--amber);margin-bottom:3px}
body.pro .qtext{font-size:25px}
.how.keys{font-size:17px;color:var(--muted)}.how.keys b{color:var(--amber);font-weight:400}
@media (hover:none),(pointer:coarse){.how.keys{display:none}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.ticker .track,.pop,.flash,.opt.wrong{animation:none}}
</style>
</head>

<script>
const EDITIONS = [{"id":"2026-11-16","label":"Week of 23 Nov 2026","covers":"News from 16–20 Nov","month":"Nov 2026","title":"Black Friday came early","blurb":"A record AI IPO couldn't stop the rout. The indexes broke and the Fed is still talking hikes.","qs":[{"tag":"Equities","q":"The Nasdaq Composite sank 5.28% on Friday. Where does that leave it for 2026?","o":["Down for the year","Still up about 10% YTD","At a record high","Exactly flat YTD"],"a":0,"x":"It closed at 22,617.73, down 2.7% for the year. The sell-off erased the index's entire 2026 gain.","s":["CNBC","https://www.cnbc.com/2026/11/19/stock-market-today-live-updates.html"]},{"tag":"Equities","q":"The S&P 500 and the Dow both finished Friday 10% below their closing records. What's that called?","o":["A bear market","A correction","A circuit breaker","A melt-up"],"a":1,"x":"A 10% drop from the peak is a correction; 20% is a bear market. The S&P fell 3.7% to 6,910.39 and the Dow lost 949.73 points to 48,147.33.","s":["CNBC","https://www.cnbc.com/2026/11/19/stock-market-today-live-updates.html"]},{"tag":"Equities","q":"The Dow lost 8% this week. When did it last have a week this bad?","o":["October 2008","December 2018","March 2020","April 2025"],"a":2,"x":"March 2020, during the COVID sell-off. The S&P 500's 8.6% drop was its worst since the 'Liberation Day' sell-off in April 2025.","s":["Yahoo Finance","https://sg.finance.yahoo.com/news/live/stock-market-today-friday-november-19-dow-sp-500-nasdaq-anthropic-nvidia-141644188.html"]},{"tag":"AI / IPOs","q":"Anthropic marketed its IPO at $70–78 a share. Where did it actually price on Wednesday?","o":["$68","$74","$78","$83"],"a":3,"x":"$83, above the range, valuing the company at about $1.5 trillion fully diluted. It jumped 17% on its Thursday debut, then fell 8.5% on Friday.","s":["Fortune","https://fortune.com/2026/11/18/anthropic-prices-ipo-83-per-share-1-5-trillion/"]},{"tag":"Earnings","q":"In Nvidia's first report since Jensen Huang resigned, fiscal Q const PRO = {"2026-01-05":[{"tag":"GLOBAL MACRO","ctx":"December jobs: unemployment ticked lower while payrolls missed. January cut odds slid from ~12% to ~5%.","q":"Why would a lower unemployment rate cut near-term Fed easing odds even though payrolls missed?","o":["Payroll misses are usually revised up, so the Fed discounts them","A lower jobless rate signals little slack, so less urgency to cut","Lower unemployment pushes wages down, which argues for a pause","The Fed's reaction function weights payrolls far above unemployment"],"a":1,"x":"The unemployment rate is the Fed's cleanest read on slack. If it falls, the labor market looks tight enough that cuts can wait, even if headline hiring is soft.","s":["E*TRADE","https://us.etrade.com/knowledge/library/perspectives/daily-insights/jan12-market-recap"]},{"tag":"EQUITIES","ctx":"The Russell 2000 jumped 4.6% vs +1.6% for the S&P 500, with value beating growth.","q":"What does small caps sharply outperforming mega-cap tech usually suggest?","o":["A defensive flight out of crowded mega-cap positions","Broadening breadth and a rotation toward cyclicals","Rising recession odds favouring smaller domestic firms","Mostly passive index-rebalancing flows at the start of the year"],"a":1,"x":"Small caps are more domestic, cyclical and rate-sensitive. Leadership broadening away from mega-caps usually signals confidence in growth, not fear.","s":["E*TRADE","https://us.etrade.com/knowledge/library/perspectives/daily-insights/jan12-market-recap"]},{"tag":"FIXED INCOME","ctx":"Treasuries rallied to start the week, pressuring long-end yields from their December highs while the 2-year held near its lows.","q":"If long yields fall more than short yields, the yield curve is…","o":["Bear steepening","Bull flattening","Inverting by definition","Unchanged in shape"],"a":1,"x":"Yields falling (prices rising) is 'bull'. The long end falling more than the front narrows the 2s10s spread, which is 'flattening'.","s":["Briefing.com","https://briefing.com/weekly-wrap/archive/2026/1/9/weekly-wrap-for-january-5-2026"]},{"tag":"FX & COMMODITIES","ctx":"Gold rose 4.1% on the week to ~$4,490 as geopolitical uncertainty climbed.","q":"Why does gold tend to rally on geopolitical stress?","o":["Its real yield rises when policy uncertainty increases","It is a store of value with no counterparty risk","Central banks are forced buyers during geopolitical stress","Its industrial demand tends to rise in conflict periods"],"a":1,"x":"Gold has no issuer that can default, so investors use it as a hedge when political or systemic risk rises.","s":["Schaeffer's via Finviz","https://finviz.com/news/272529/stocks-start-first-full-week-of-2026-strong"]}],"2026-01-12":[{"tag":"GLOBAL MACRO","ctx":"Questions over Fed independence weighed on sentiment as earnings season began.","q":"Why do markets care about central-bank independence?","o":["It mainly determines the size of the Fed's balance sheet","Political pressure can raise inflation expectations and term premium","Independence affects FX markets but rarely bond yields","It sets how quickly the Fed publishes its policy minutes"],"a":1,"x":"If investors fear rates will be set for political reasons, they demand more compensation for long-run inflation risk, pushing up long yields and the term premium.","s":["Schaeffer's via Finviz","https://finviz.com/news/279403/stocks-finish-quietly-lower-amid-fed-independence-questions"]},{"tag":"EQUITIES","ctx":"TSMC's strong results, forecasts and capex plans revived the AI trade.","q":"Why does a foundry's capex guidance move AI stocks globally?","o":["Foundry capex directly sets pricing for US hyperscaler cloud","It signals expected chip demand across the AI supply chain","It changes the index weights of Asian chip stocks in the S&P","It is a lagging indicator that confirms prior quarter AI sales"],"a":1,"x":"TSMC builds chips for most AI designers. Higher capex means it expects sustained demand, which is read through to Nvidia, hypersc ting prices, while retaliation and uncertainty weigh on trade, investment and growth.","s":["Briefing.com","https://www.briefing.com/weekly-wrap/archive/2026/1/23/weekly-wrap-for-january-20-2026"]},{"tag":"EQUITIES","ctx":"Intel fell ~17% on weak Q1 guidance after rising nearly 50% in 2026.","q":"Why can a stock that has run up sharply fall hardest on a guidance miss?","o":["Momentum funds are required to sell on any guidance change","High expectations are priced in, so a miss triggers a de-rating","Guidance misses mechanically raise the company's cost of debt","Analysts must cut targets to zero after a guidance miss"],"a":1,"x":"After a big run, the price embeds optimistic forecasts. A miss forces both lower earnings estimates and a lower multiple.","s":["Briefing.com","https://briefing.com/stock-market-update/archive/2026/1/23/mixed-finish-as-weak-breadth-weighs-against-megacap-strength"]},{"tag":"FIXED INCOME","ctx":"US Treasuries were little changed after a rout in Japanese government bonds.","q":"How can a JGB sell-off spill over into US Treasuries?","o":["JGB losses force the BoJ to sell its Treasury reserves","Higher JGB yields can draw Japanese money home from foreign bonds","Treasuries rally as global investors flee Japanese debt","JGB yields set the floor for US term premium by convention"],"a":1,"x":"Japanese investors are big holders of Treasuries. Higher domestic yields make it more attractive to bring money home, which can pressure global yields.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-january-23-2026.html"]},{"tag":"FX & COMMODITIES","ctx":"Silver gained ~13% on the week and gold hit records as the dollar slid.","q":"Why is silver usually more volatile than gold?","o":["Central banks hold more silver, so policy shifts hit it harder","A smaller market with industrial and monetary demand: higher beta","It is priced off oil, which is more volatile than gold","Silver futures trade with lower margin than gold, by rule"],"a":1,"x":"Silver's market is much smaller and driven by both industrial and investment demand, so flows move it harder in both directions.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-january-23-2026.html"]}],"2026-01-26":[{"tag":"GLOBAL MACRO","ctx":"Trump nominated Kevin Warsh as Fed chair. The dollar had its best day since July and precious metals crashed.","q":"Why might markets read a perceived inflation hawk as Fed chair as bearish for gold?","o":["Higher expected real rates raise the opportunity cost of gold","Hawks tend to sell the Fed's gold reserves to cut inflation","A hawk weakens the dollar, which lowers dollar gold prices","Higher rates lift mining costs, reducing gold supply"],"a":0,"x":"Gold pays no yield. Expectations of tighter policy lift real rates and the dollar, both of which tend to weigh on bullion.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-january-30-2026.html"]},{"tag":"EQUITIES","ctx":"Apple fell despite record iPhone sales.","q":"Which is the most likely explanation for a stock dropping on a record quarter?","o":["Record quarters trigger mandatory index-fund selling","Results fell short of 'whisper' expectations already priced in","Strong results raise rate expectations, cutting its multiple","Records usually come with share issuance that dilutes holders"],"a":1,"x":"Markets trade on surprises relative to expectations, not absolute results. A record can still disappoint if buy-side hopes were higher.","s":["Schaeffer's via Finviz","https://finviz.com/news/294183/stocks-slip-friday-dow-extends-monthly-win-streak"]},{"tag":"FIXED INCOME","ctx":"The Fed held rates. Odds of a cut going in were barely above zero, so bonds barely reacted.","q":"Why did bonds hardly move on the Fed decision?","o":["The decision was fully priced in","The statement was dovish, offsetting the hold","Treasury supply news dominated the day","Bond markets closed early for the meeting"] d keep 2026 tariff revenue roughly unchanged.","q":"Why did markets react calmly to a landmark tariff ruling?","o":["The ruling only applied to tariffs that had already expired","Investors expected tariffs to return under other authorities","Equity markets had already priced a full tariff rollback","The ruling lowered inflation expectations, offsetting the shock"],"a":1,"x":"If the effective tariff burden stays the same through other legal routes, the economic impact barely changes and there's little to reprice.","s":["TheStreet Pro","https://pro.thestreet.com/portfolio/weekly-roundup-market-jumps-on-tariff-ruling-but-braces-for-new-trade-moves"]},{"tag":"EQUITIES","ctx":"The S&P 500 had traded in a ~4% range (6,720–7,002) for 12 weeks.","q":"A long, tight trading range in an index after a big rally usually reflects…","o":["Distribution ahead of a likely bear market","Consolidation, with rotation under the surface","A sign that volatility sellers have left the market","Exhaustion of buybacks as companies enter blackout"],"a":1,"x":"Flat index levels can hide big sector swings. Gains in some groups offset losses in others while the market digests earlier gains.","s":["E*TRADE","https://us.etrade.com/knowledge/library/perspectives/daily-insights/feb23-market-recap"]},{"tag":"FIXED INCOME","ctx":"Treasury yields rose as US–Iran tension lifted energy prices.","q":"Why can an oil shock push bond yields higher?","o":["Energy firms issue more bonds when oil prices rise","Higher energy prices lift breakevens and nominal yields","Oil shocks lower growth, so investors sell bonds","Higher oil strengthens the dollar, pushing yields up"],"a":1,"x":"Energy feeds directly into headline inflation. Higher expected inflation means bond investors demand higher nominal yields.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-february-20-2026.html"]},{"tag":"FX & COMMODITIES","ctx":"Gold held above $5,000 even as risk assets rose.","q":"Gold rising along ller firms rely more on bank and floating-rate financing and have less pricing power, so cost and rate shocks bite harder.","s":["Stock Focus Report","https://stockfocusreport.beehiiv.com/p/new-post-efd2"]},{"tag":"FIXED INCOME","ctx":"Treasury yields rose alongside oil, and bonds failed to hedge stocks.","q":"When bonds and stocks fall together, the usual 60/40 diversification breaks because…","o":["Correlation turns positive when inflation is the main shock","Bond coupons are fixed, so they can't offset equity losses","Rebalancing flows force selling in both at once","Central banks sell bonds to support equity markets"],"a":0,"x":"In inflation shocks, rising yields hurt both bond prices and equity valuations, so the stock–bond correlation turns positive.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-march-6-2026.html"]},{"tag":"FX & COMMODITIES","ctx":"Gold failed to draw a haven bid and the dollar advanced as war broke out.","q":"Why might the dollar, not gold, win the haven bid in a war-driven oil shock?","o":["The US is a net energy exporter and dollar liquidity is in demand","Gold falls whenever oil rises because of mining costs","The dollar is formally linked to oil through OPEC pricing","Gold's real yield rises when inflation expectations climb"],"a":0,"x":"In stress, investors scramble for dollar liquidity. As an energy exporter, the US also sees better terms of trade when oil rises.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-march-6-2026.html"]}],"2026-03-09":[{"tag":"GLOBAL MACRO","ctx":"Crude topped $100 while February CPI held at 2.4%.","q":"Why might a steady CPI print not reassure investors during an oil spike?","o":["CPI is backward-looking; energy pass-through comes later","CPI excludes gasoline, so oil moves never show up","CPI uses annual weights that remove energy shocks","A steady print means the Fed will cut regardless of oil"],"a":0,"x":"February CPI predates most of th lars for energy, which worsens trade balances and puts pressure on the currency.","s":["CoinCentral via MEXC","https://www.mexc.com/news/926775"]}],"2026-03-16":[{"tag":"GLOBAL MACRO","ctx":"Markets moved from pricing 2.5 Fed cuts in 2026 to a non-trivial chance of hikes. The Fed revised its growth forecasts up.","q":"If the Fed raises growth forecasts during an oil shock, it is signalling…","o":["An imminent cut because growth is now strong","Less stagflation worry, giving room to stay hawkish","That inflation is expected to fall below target soon","A shift to targeting growth rather than inflation"],"a":1,"x":"Stronger expected growth lowers the downside risk, so the Fed can focus on inflation and keep policy tight.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-march-20-2026.html"]},{"tag":"EQUITIES","ctx":"Meta rose on a report it may cut up to 20% of staff as AI costs rise.","q":"Why do markets often reward large layoff announcements?","o":["Layoffs signal demand is about to accelerate","Lower costs can lift margins and free cash flow","Severance is excluded from reported earnings","Layoffs force index funds to raise their weightings"],"a":1,"x":"Investors focus on margins. Cutting fixed costs offsets heavy AI spending, which protects earnings per share.","s":["Briefing.com","https://briefing.com/weekly-wrap/archive/2026/3/20/weekly-wrap-for-march-16-2026"]},{"tag":"FIXED INCOME","ctx":"Global front-end yields surged as markets reassessed the path of rate cuts.","q":"A sharp rise in 2-year yields with a smaller move in 10s is…","o":["Bull steepening","Bear flattening","Bull flattening","No change"],"a":1,"x":"Yields rising is 'bear'. The front end rising more than the long end narrows the curve, which is 'flattening'. This is typical when hikes get priced.","s":["LPL Research","https://www.lpl.com/research/blog/weekly-market-performance-march-20-2026.html"]},{"tag":"FX & COMMODITIES","ctx":"Gold fell more than 10% in its worst ance of one cut by year-end as hopes grew for an end to the fighting.","q":"What would most likely shift pricing from 'hikes possible' to 'cuts possible'?","o":["A strong payrolls report with rising wages","Falling energy prices easing the inflation outlook","A rally in equities lifting household wealth","A widening federal deficit raising issuance"],"a":1,"x":"The hike risk was driven by energy inflation. If oil falls, the inflation threat fades and easing comes back into view.","s":["First Western","https://myfw.com/?p=40899"]},{"tag":"EQUITIES","ctx":"The S&P 500 hit a record just three weeks after its 2026 low, while software stayed down ~16% YTD.","q":"A record index level with a major industry group still deeply negative indicates…","o":["Broad, healthy participation","Narrow, concentrated leadership","Early bear-market conditions","Low correlation across sectors"],"a":1,"x":"Index records driven by a few groups (semis, mega-caps) while others lag point to narrow breadth.","s":["E*TRADE","https://us.etrade.com/knowledge/library/perspectives/daily-insights/apr20-market-recap"]},{"tag":"FIXED INCOME","ctx":"Crude fell ~13.6% on the week as the ceasefire held.","q":"Falling oil typically affects TIPS breakevens how?","o":["Breakevens fall as expected inflation declines","Breakevens rise as real yields fall","Breakevens stay flat; only nominals move","TIPS principal is cut immediately"],"a":0,"x":"Breakeven inflation (nominal minus TIPS yield) is closely tied to energy prices, so it tends to fall with oil.","s":["Stock Rover","https://www.stockrover.com/?p=42745"]},{"tag":"FX & COMMODITIES","ctx":"Gold rose ~1.9% and copper ~3.7% as risk appetite returned.","q":"Copper is often called 'Dr. Copper' because…","o":["It tracks consumer inflation more closely than CPI","Its price is seen as a gauge of global industrial demand","Its price is linked to the Chinese yuan by policy","It leads gold prices by about three months"],"a":1,"x":"Copper is used across construction, /* ---------- candles ---------- */
function candles(cum,slots,opts={}){
  const n=slots, W=n*8+4, H=opts.h||44;
  const vals=cum.slice();
  let lo=Math.min(-3,...vals)-1, hi=Math.max(3,...vals)+1;
  const y=v=>Math.round((hi-v)/(hi-lo)*(H-4))+2;
  let s=`<rect x="0" y="${y(0)}" width="${W}" height="1" fill="#a86f00" fill-opacity=".7"/>`;
  for(let i=0;i<n;i++){
    const x=2+i*8;
    if(i>=cum.length-1){ s+=`<rect x="${x+1}" y="${y(0)-1}" width="4" height="2" fill="#22304d"/>`; continue; }
    const o=cum[i], c=cum[i+1], up=c>=o, col=up?"#3ddc84":"#ff4d5e";
    const top=Math.min(y(o),y(c)), bot=Math.max(y(o),y(c));
    const wt=Math.min(top, y(Math.max(o,c)+0.35)), wb=Math.max(bot, y(Math.min(o,c)-0.35));
    s+=`<rect x="${x+3}" y="${wt}" width="1" height="${wb-wt+1}" fill="${col}"/>`;
    s+=`<rect x="${x+1}" y="${top}" width="5" height="${Math.max(2,bot-top+1)}" fill="${col}"/>`;
  }
  return `<svg class="px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="${opts.px||H*2}" aria-hidden="true">${s}</svg>`;
}
function miniChart(d){
  const pts=d==="up"?[14,12,13,9,10,6,7,3]:[3,5,4,8,7,11,10,14];
  let s=""; pts.forEach((v,i)=>{ s+=`<rect x="${i*3}" y="${v}" width="3" height="${16-v}" fill="${d==="up"?"#1d8a50":"#9e2735"}"/><rect x="${i*3}" y="${v}" width="3" height="1" fill="${d==="up"?"#3ddc84":"#ff4d5e"}"/>`; });
  return `<svg class="px" width="72" height="48" viewBox="0 0 24 16" aria-hidden="true">${s}</svg>`;
}

let soundOn=store.get("sound"); if(soundOn===null) soundOn=true;
let ac=null;
function beep(f,dur,when=0,type="square",vol=.05,slide){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.linearRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}

    ${'<div class="how keys">⌨ <b>A–D</b> or <b>1–4</b> answer · <b>Enter</b> start / next · <b>M</b> switch desk · <b>Esc</b> back to desk</div>'}${mode==='pro'?'<div class="how">For PMs, private bankers and investment counsellors: each call starts from a real event that week and asks what it means across <u>macro, equities, fixed income and FX/commodities</u>. Same P&amp;L scoring.</div>':''}<div class="how"><em>Right</em> = +1% to +2%, more if you're fast · <u>Streak</u> = +0.5x leverage each · <i>Wrong</i> = −1.5% and leverage resets</div>
  </section>
  <div class="btnrow">
    ${prev?`<button class="btn" id="see">VIEW STATEMENT</button><button class="btn ghost" id="go">TRADE AGAIN · PAPER</button>`
          :`<button class="btn" id="go">🔔 RING THE BELL</button>`}
    <button class="btn ghost" id="arch">ALL ${EDITIONS.length} WEEKS</button>
  </div>`;
  sprite(document.getElementById("homeTrader"),TRADER.idle,5);
  sprite(document.getElementById("bell"),BELL,4);
  app.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{setMode(b.dataset.m);sfx.select();showHome(ed)});
  $("#go").onclick=()=>{sfx.bell();startGame(ed,!!prev)};
  $("#arch").onclick=()=>{sfx.select();showArchive()};
  if(prev) $("#see").onclick=()=>{sfx.select();showResult(ed,prev,false)};
  window.scrollTo({top:0});
}

function showArchive(){
  clearInterval(timerId); view="archive"; navBtn.textContent="BACK";
  app.innerHTML=`<section class="panel"><div class="badge m">ARCHIVE</div>
    <div class="ptitle">THE 2026 TAPE</div><p class="blurb">Every week of 2026, newest first. Each edition quizzes you on the previous week's news.</p>
    ${(()=>{let m='';const played=EDITIONS.filter(e=>store.get(KEY(e)));const tot=played.reduce((s,e)=>s+store.get(KEY(e)).pnl,0);return (played.length?`<div class="ytd">SEASON P&amp;L <b style="color:${tot>=0?'var(--green)':'var(--red)'}">${pct(tot)}</b> · ${played.length}/${EDITIONS.length} WEEKS TRADED</div>`:'')+EDITIONS.map((e,i)=>{const r=store.get(KEY(e));const h=e.month!==m?(m=e.month,`<div class="mhead">${esc(e.month.toUpperCase())}</div>`):'';return h+`<div class="ed" data-i="${i}" tabindex="0"><div><b>#${dayNo(e)} · ${esc(e.title.toUpperCase())}</b><span>${esc(e.covers)}</span></div><em style="color:${r?(r.pnl>=0?"var(--green)":"var(--red)"):"var(--amber)"}">${r?pct(r.pnl):"TRADE ▶"}</em></div>`}).join('')})()}
  </section>`;
  app.querySelectorAll(".ed").forEach(el=>el.onclick=()=>{sfx.select();showHome(EDITIONS[+el.dataset.i])});
  window.scrollTo({top:0});
}

function startGame(ed,paper){
  view="game"; currentEd=ed; navBtn.textContent="QUIT";
  state={ed,paper,i:0,pnl:0,streak:0,best:0,cum:[0],marks:[],picks:[],times:[],deltas:[],answered:-1,mood:"idle"};
  window.scrollTo({top:0}); renderQ();
}
const lev=()=>1+0.5*Math.max(0,state.streak-1);

function hudHTML(){
  return `<div class="hud">
    <div class="q">TRADE ${state.i+1}/${QS(state.ed).length}${state.paper?" · PAPER":""}</div>
    <div class="pnl ${dir(state.pnl)}" id="pnl">${pct(state.pnl)}</div>
    <div class="q" style="color:var(--faint)">WEEK P&amp;L</div>
    <div class="lev" id="lev">LEV ${state.streak>=1?lev().toFixed(1):"1.0"}x</div>
  </div>
  <div class="chartbox"><div id="chart" style="flex:1">${candles(state.cum,QS(state.ed).length,{h:40,px:72})}</div><svg class="px" id="gameTrader"></svg></div>`;
}

function renderQ(){
  const {ed,i}=state,Q=QS(ed)[i];
  app.innerHTML=`${hudHTML()}
  <div class="timer" id="timer">${"<i></i>".repeat(TIME)}</div>
  <div class="tlabel"><span>TIME TO CLOSE</span><span id="secs">${TIME}s</span></div>
  <section class="panel">
    <div class="badge">${esc(Q.tag.toUpperCase())}</div>
    ${Q.ctx?`<div class="ctx"><b>ON THE TAPE</b>${esc(Q.ctx)}</div>`:''}<div class="qtext">${esc(Q.q)}</div>
    <div class="opts">${order(ed,i).map((k,p)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[p]}</span><span>${esc(Q.o[k])}</span></button>`).join("")}</div>
    <div class="reveal" id="reveal"></div>
  </section>`;
  sprite(document.getElementById("gameTrader"),TRADER[state.mood],4);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const segs=[...app.querySelectorAll(".timer i")],tw=$("#timer"),secs=$("#secs");
  const start=performance.now(); state.t0=start; let last=TIME;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const left=Math.max(0,TIME-(performance.now()-start)/1000),whole=Math.ceil(left);
    segs.forEach((s,j)=>s.classList.toggle("off",j>=whole));
    tw.classList.toggle("low",left<5); secs.textContent=whole+"s";
    if(whole<last){last=whole; if(whole<=5&&whole>0) sfx.tick();}
    if(left<=0){clearInterval(timerId);answer(-1)}
  },50);
}

function answer(k){
  if(state.answered===state.i) return;
  state.answered=state.i; clearInterval(timerId);
  const Q=QS(state.ed)[state.i];
  const left=Math.max(0,TIME-(performance.now()-state.t0)/1000);
  const ok=k===Q.a; let delta;
  if(ok){ state.streak++; state.best=Math.max(state.best,state.streak);
    delta=Math.round((1+left/TIME)*lev()*100)/100; sfx.cash(); flash("#3ddc84"); state.mood="cheer";
  } else { state.streak=0; delta=-LOSS; sfx.buzz(); flash("#ff4d5e"); state.mood="slump"; }
  state.pnl=Math.round((state.pnl+delta)*100)/100;
  state.cum.push(state.pnl); state.deltas.push(delta);
  state.marks.push(ok); state.picks.push(k); state.times.push(TIME-left);
  pop(pct(delta),ok?"#3ddc84":"#ff4d5e");

  app.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.k;b.disabled=true;
    if(j===Q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong");else b.classList.add("faded");});
  const p=$("#pnl"); p.textContent=pct(state.pnl); p.className="pnl "+dir(state.pnl);
  $("#lev").textContent=`LEV ${ok?lev().toFixed(1):"1.0"}x`;
  $("#chart").innerHTML=candles(state.cum,QS(state.ed).length,{h:40,px:72});
  sprite(document.getElementById("gameTrader"),TRADER[state.mood],4);

  const last=state.i===QS(state.ed).length-1,r=$("#reveal");
  r.innerHTML=`<div class="verdict ${ok?"good":"bad"}">${ok?`FILLED · ${pct(delta)}${state.streak>1?` · ${lev().toFixed(1)}x`:""}`:(k<0?`EXPIRED · ${pct(delta)}`:`STOPPED OUT · ${pct(delta)}`)}</div>
    <p>${esc(Q.x)}</p>
    <a class="src" href="${esc(Q.s[1])}" target="_blank" rel="noopener">Source: ${esc(Q.s[0])} ↗</a>
    <button class="btn" id="next">${last?"🔔 CLOSING BELL":"NEXT TRADE ▶"}</button>`;
  r.classList.add("show");
  $("#next").onclick=()=>{ if(last){sfx.bell();finish()} else {sfx.select();state.i++;renderQ();window.scrollTo({top:0})} };
}

function finish(){
  const res={pnl:state.pnl,cum:state.cum,deltas:state.deltas,marks:state.marks,picks:state.picks,best:state.best,
    avg:state.times.reduce((a,b)=>a+b,0)/state.times.length};
  if(!state.paper) store.set(KEY(state.ed),res);
  setTimeout(sfx.close,600);
  showResult(state.ed,res,state.paper);
}

function shareText(ed,res){
  const right=res.marks.filter(Boolean).length;
  return `THE TAPE${mode==='pro'?' PRO':''} · WEEK #${dayNo(ed)} ${res.pnl>=0?"📈":"📉"}\n${res.marks.map(m=>m?"🟩":"🟥").join("")}\n${pct(res.pnl)} · ${right}/${res.marks.length} · ${rankFor(res.pnl).name}`;
}

function showResult(ed,res,paper){
  clearInterval(timerId); view="result"; navBtn.textContent="ARCHIVE"; window.scrollTo({top:0});
  const rk=rankFor(res.pnl),right=res.marks.filter(Boolean).length;
  const other=EDITIONS.find(e=>e!==ed&&!store.get(KEY(e)));
  app.innerHTML=`
  <section class="panel">
    <div class="badge ${res.pnl>=0?"g":"r"}">${paper?"PAPER TRADING":"END OF DAY STATEMENT"}</div>
    <div class="stmt-head"><span>WEEK #${dayNo(ed)}</span><span>${esc(ed.covers.toUpperCase())}</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div><div class="final" style="color:${res.pnl>=0?"var(--green)":"var(--red)"}">${pct(res.pnl)}</div><div class="rank">${rk.name}</div></div>
      <svg class="px" id="endTrader"></svg>
    </div>
    <div class="rsub">${rk.sub}</div>
    <div class="bigchart">${candles(res.cum,res.marks.length,{h:44,px:120})}</div>
    <div class="stats">
      <div class="stat"><b>${right}/${res.marks.length}</b><span>hit rate</span></div>
      <div class="stat"><b>${res.best>1?(1+0.5*(res.best-1)).toFixed(1):"1.0"}x</b><span>max lev</span></div>
      <div class="stat"><b>${res.avg.toFixed(1)}s</b><span>avg fill</span></div>
    </div>
    <textarea class="copyarea" id="ca" rows="3" readonly></textarea>
  </section>
  <div class="btnrow">
    <button class="btn" id="copy">SHARE P&amp;L</button>
    ${other?`<button class="btn ghost" id="other">NEXT: WEEK #${dayNo(other)}</button>`:""}
    <button class="btn ghost" id="home">BACK TO DESK</button>
  </div>
  <section class="panel"><div class="badge m">TRADE LOG</div>
    <div class="ledger">${QS(ed).map((q,i)=>{const d=res.deltas?res.deltas[i]:(res.marks[i]?1:-LOSS);return `<div class="lrow"><div class="n">${String(i+1).padStart(2,"0")}</div><div><b>${esc(q.q)}</b><span><em>${esc(q.o[q.a])}</em>${!res.marks[i]&&res.picks&&res.picks[i]>=0?` · you said ${esc(q.o[res.picks[i]])}`:""}</span></div><div class="amt ${d>=0?"up":"dn"}">${pct(d)}</div></div>`}).join("")}</div>
  </section>`;
  sprite(document.getElementById("endTrader"),res.pnl>=0?TRADER.cheer:TRADER.slump,5);
  $("#copy").onclick=()=>{sfx.select();shareCard(ed,res)};
  $("#home").onclick=()=>{sfx.select();showHome(ed)};
  if(other) $("#other").onclick=()=>{sfx.select();showHome(other)};
}

/* ---------- share card (canvas → clipboard image) ---------- */
function drawShareCard(ed,res){
  const W=1080,H=1080,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");x.imageSmoothingEnabled=false;
  const C={bg:"#070b14",panel:"#0f1729",line:"#22304d",line2:"#33456a",amber:mode==='pro'?"#5cc8ff":"#ffb000",amberlo:mode==='pro'?"#2a6f99":"#a86f00",green:"#3ddc84",red:"#ff4d5e",ink:"#e6edf5",muted:"#7f8ea8"};
  const up=res.pnl>=0, col=up?C.green:C.red, rk=rankFor(res.pnl), right=res.marks.filter(Boolean).length;
  const P=(f,s)=>`${s}px "${f}", monospace`;
  // background + grid
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  x.fillStyle="#0b1222";for(let i=0;i<W;i+=40){x.fillRect(i,0,3,H);x.fillRect(0,i,W,3)}
  // ticker bar
  x.fillStyle="#000";x.fillRect(0,0,W,70);x.fillStyle=C.amber;x.fillRect(0,66,W,6);x.fillRect(0,0,150,66);
  x.fillStyle="#000";x.font=P("Silkscreen",26);x.textBaseline="middle";x.fillText("LIVE",36,34);
  x.font=P("VT323",40);let tx=180;
  ((DESK[ed.id]||{tape:[]}).tape).slice(0,4).forEach(([a,b,d])=>{x.fillStyle=C.ink;x.fillText(a,tx,36);tx+=x.measureText(a+" ").width;x.fillStyle=d==="up"?C.green:d==="dn"?C.red:C.amber;const s=(d==="up"?"▲":d==="dn"?"▼":"")+b;x.fillText(s,tx,36);tx+=x.measureText(s).width+40});
  // panel
  x.fillStyle="#000";x.fillRect(66,126,W-120,H-200);
  x.fillStyle=C.panel;x.fillRect(54,114,W-120,H-200);x.strokeStyle=C.line2;x.lineWidth=6;x.strokeRect(57,117,W-126,H-206);
  // header
  x.fillStyle=C.amber;x.font=P("Silkscreen",56);x.textBaseline="alphabetic";
  x.fillStyle=C.amberlo;x.fillText("THE TAPE",104,214);x.fillStyle=C.amber;x.fillText("THE TAPE",98,208);
  x.fillStyle=C.muted;x.font=P("Silkscreen",22);x.fillText(mode==='pro'?"PRO DESK · CROSS-ASSET":"WEEKLY MARKET QUIZ",100,248);
  x.textAlign="right";x.fillStyle=C.ink;x.fillText(`WEEK #${dayNo(ed)}`,W-100,200);x.fillStyle=C.muted;x.fillText(ed.covers.toUpperCase(),W-100,240);x.textAlign="left";
  x.fillStyle=C.line;x.fillRect(98,272,W-200,4);
  x.fillStyle=C.ink;x.font=P("Silkscreen",30);x.fillText(ed.title.toUpperCase().slice(0,30),98,324);
  // big P&L
  x.font=P("Silkscreen",150);const pt=pct(res.pnl);
  x.fillStyle="#000";x.fillText(pt,108,490);x.fillStyle=col;x.fillText(pt,98,480);
  x.fillStyle=C.amber;x.font=P("Silkscreen",40);x.fillText(rk.name,100,546);
  // trader sprite
  const rows=up?TRADER.cheer:TRADER.slump, s=12, ox=W-100-rows[0].length*s, oy=360;
  rows.forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(ox+xx*s,oy+yy*s,s,s)}}));
  // candle chart
  const cx=98,cy=590,cw=W-196,ch=220;x.fillStyle="#000";x.fillRect(cx,cy,cw,ch);x.strokeStyle=C.line2;x.lineWidth=4;x.strokeRect(cx,cy,cw,ch);
  const cum=res.cum||[0];let lo=Math.min(-3,...cum)-1,hi=Math.max(3,...cum)+1;const Y=v=>cy+14+(hi-v)/(hi-lo)*(ch-28);
  x.fillStyle=C.amberlo;for(let i=cx+10;i<cx+cw-10;i+=16)x.fillRect(i,Y(0)-2,8,4);
  const n=res.marks.length,slot=(cw-40)/n;
  for(let i=0;i<cum.length-1;i++){const o=cum[i],cl=cum[i+1],g=cl>=o,X=cx+20+i*slot+slot/2;x.fillStyle=g?C.green:C.red;
    const t=Math.min(Y(o),Y(cl)),b=Math.max(Y(o),Y(cl));x.fillRect(X-4,Math.min(t,Y(Math.max(o,cl)+.35)),8,Math.max(b,Y(Math.min(o,cl)-.35))-Math.min(t,Y(Math.max(o,cl)+.35)));x.fillRect(X-slot*0.3,t,slot*0.6,Math.max(10,b-t))}
  // squares + stats
  res.marks.forEach((m,i)=>{x.fillStyle=m?C.green:C.red;x.fillRect(98+i*58,832,44,44);x.fillStyle="rgba(0,0,0,.35)";x.fillRect(98+i*58+33,832,11,44);x.fillRect(98+i*58,865,44,11)});
  x.font=P("Silkscreen",24);x.fillStyle=C.muted;x.textBaseline="middle";
  x.fillText(`HIT ${right}/${n} · LEV ${res.best>1?(1+.5*(res.best-1)).toFixed(1):"1.0"}x · ${res.avg.toFixed(1)}s`,520,855);
  // footer
  x.fillStyle=C.amber;x.fillRect(54,918,W-120,70);x.fillStyle="#000";x.font=P("Silkscreen",28);
  x.fillText("CAN YOU BEAT MY P&L?",84,954);
  const host=/github\.io|\./.test(location.hostname)&&!/claude|usercontent|^$/.test(location.hostname)?location.hostname+location.pathname.replace(/index\.html$/,""):"";
  if(host){x.textAlign="right";x.font=P("Silkscreen",20);x.fillText(host.toUpperCase().slice(0,30),W-90,954);x.textAlign="left"}
  return c;
}
function shareCard(ed,res){
  const canvas=drawShareCard(ed,res), text=shareText(ed,res);
  const blobP=new Promise(r=>canvas.toBlob(r,"image/png"));
  const showPreview=(msg)=>{
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="box"><img alt="Your P&L card" src="${canvas.toDataURL("image/png")}"><div class="hint">${msg}</div><div class="btnrow"><button class="btn ghost" id="mtxt">COPY TEXT INSTEAD</button><button class="btn" id="mclose">CLOSE</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("#mclose").onclick=()=>m.remove();
    m.onclick=e=>{if(e.target===m)m.remove()};
    m.querySelector("#mtxt").onclick=async()=>{try{await navigator.clipboard.writeText(text);toast("TEXT COPIED")}catch(e){toast("COPY FAILED")}};
  };
  // 1) image to clipboard (must start synchronously inside the click)
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({"image/png":blobP})])
        .then(()=>{toast("IMAGE COPIED — PASTE IT ANYWHERE");showPreview("Copied to your clipboard. Paste it into any chat.")})
        .catch(()=>fallback());
      return;
    }
  }catch(e){}
  fallback();
  async function fallback(){
    const blob=await blobP;
    try{
      const file=new File([blob],`the-tape-week-${dayNo(ed)}.png`,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
    }catch(e){if(e&&e.name==="AbortError")return}
    showPreview("Long-press or right-click the image to copy or save it.");
  }
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat) return;
  const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  const k=e.key, K=k.toUpperCase(), q=s=>document.querySelector(s);
  const click=el=>{ if(el&&!el.disabled){ e.preventDefault(); el.click(); return true } return false };
  const modal=q(".modal");
  if(modal){ if(k==="Escape"||k==="Enter") click(modal.querySelector("#mclose")); return; }
  if(k==="Escape"){ if(view!=="home"){ e.preventDefault(); sfx.select(); showHome(currentEd) } return; }
  if(view==="game"){
    const i="ABCD".indexOf(K)>=0?"ABCD".indexOf(K):"1234".indexOf(k);
    if(i>=0 && K.length===1){ const opts=document.querySelectorAll(".opt"); click(opts[i]); return; }
    if(k==="Enter"||k===" "||k==="ArrowRight") click(q("#next"));
    return;
  }
  if(view==="home"){
    if(k==="Enter"||k===" ") click(q("#go"));
    else if(K==="M"){ const b=q('.mbtn:not(.on)'); click(b); }
    else if(K==="V") click(q("#see"));
    else if(K==="W") click(q("#arch"));
    return;
  }
  if(view==="result"||q("#copy")){
    if(K==="S") click(q("#copy"));
    else if(k==="Enter"||k==="ArrowRight") click(q("#other")) || click(q("#home"));
    return;
  }
});

setMode(mode);
showHome(EDITIONS[0]);
</script>
